<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DecentralMindz DAO | Forging the Future of NFTs & Web3 Alpha</title>
    <meta name="description" content="DecentralMindz DAO connects builders, contributors, and alpha minds. We partner with top NFT and Web3 projects for marketing campaigns, securing whitelists, airdrops, and meme alpha for our community." />
    <meta property="og:title" content="DecentralMindz DAO | Forging the Future of NFTs & Web3 Alpha" />
    <meta property="og:description" content="DecentralMindz DAO connects builders, contributors, and alpha minds. We partner with top NFT and Web3 projects for marketing campaigns, securing whitelists, airdrops, and meme alpha for our community." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Instant Theme Detection Script: Prevents white screen and FOUC before paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dm_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#ffffff';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#020617';
        }
      })();
    </script>

    <!-- Critical Pre-loader CSS for instant render before JS loads -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #ffffff;
      }
      #initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      html:not(.dark) #initial-preloader {
        background-color: #ffffff;
        color: #0f172a;
      }
      @keyframes dmPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes dmBarPulse {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(200%); }
      }
      .pre-logo-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: dmPulse 2s ease-in-out infinite;
      }
      .pre-logo-glow {
        position: absolute;
        inset: -6px;
        border-radius: 22px;
        background: linear-gradient(135deg, #06b6d4, #6366f1, #a855f7);
        filter: blur(14px);
        opacity: 0.7;
      }
      .pre-logo-inner {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 18px;
        background: #020617;
        padding: 2px;
        overflow: hidden;
        border: 1px solid rgba(168, 85, 247, 0.4);
      }
      .pre-logo-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
      }
      .pre-bar-track {
        width: 200px;
        height: 4px;
        background: rgba(148, 163, 184, 0.15);
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 24px;
        position: relative;
      }
      .pre-bar-fill {
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
        border-radius: 9999px;
        animation: dmBarPulse 1.4s ease-in-out infinite;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen">
    <!-- Immediate Pre-loader inside #root: Replaced instantly once React mounts -->
    <div id="root">
      <div id="initial-preloader">
        <div class="pre-logo-wrap">
          <div class="pre-logo-glow"></div>
          <div class="pre-logo-inner">
            <img src="/logo.png" alt="DecentralMindz DAO" onerror="this.style.display='none'" />
          </div>
        </div>
        <div style="margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em;">DecentralMindz</span>
          <span style="font-size: 10px; font-weight: 800; font-family: monospace; padding: 2px 6px; border-radius: 9999px; background: rgba(168, 85, 247, 0.25); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4);">DAO</span>
        </div>
        <p style="font-size: 11px; color: #94a3b8; margin: 8px 0 0 0; letter-spacing: 0.08em; font-family: monospace; text-transform: uppercase;">
          Connecting Alpha Network...
        </p>
        <div class="pre-bar-track">
          <div class="pre-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
